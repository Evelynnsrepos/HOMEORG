# Builds the Android APK and an unsigned iOS IPA and attaches both to a
# GitHub release.
#
#   git tag v1.3.0 && git push origin v1.3.0      -> release "v1.3.0" with the APK
#   git tag v1.3.0-beta.1 && git push ...        -> the same, marked as a pre-release
#   Actions tab -> Release -> Run workflow        -> APK as a build artifact only
#
# Signing: with the four ANDROID_* secrets set (see AGENTS.md), the APK is
# signed with your own key and installs over the copy you built at home. Without
# them it is signed with a throwaway debug key — fine to try, but Android will
# not let it update an install made with your real key.
#
# iOS: the IPA is unsigned on purpose. A sideloading tool (AltStore, SideStore,
# Sideloadly) signs it with your own Apple ID when it installs it — see
# "iPhone" in the README. Public repos get the macOS machine for free.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: write

jobs:
  apk:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Check
        run: |
          npm run tsc
          npm test

      - name: Native project
        run: npx expo prebuild -p android --no-install

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a debug key and won't update an existing install."
            exit 0
          fi
          mkdir -p credentials
          echo "$KEYSTORE_BASE64" | base64 -d > credentials/tidywell.keystore
          {
            echo "TIDYWELL_STORE_FILE=../../credentials/tidywell.keystore"
            echo "TIDYWELL_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TIDYWELL_KEY_ALIAS=$KEY_ALIAS"
            echo "TIDYWELL_KEY_PASSWORD=$KEY_PASSWORD"
          } > credentials/keystore.properties
          node scripts/sign-android.js

      - name: Build
        run: node scripts/build-apk.js

      - name: Name the APK
        id: apk
        run: |
          name="homeorg-${GITHUB_REF_NAME//\//-}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          # v1.3.0-beta.1 and the like are test builds, not the real thing
          prerelease: ${{ contains(github.ref_name, '-') }}

  ipa:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Native project
        run: npx expo prebuild -p ios --no-install

      # Reminders are local notifications, which need no push entitlement, and a
      # free Apple ID can't sign one: without this the sideload signing fails.
      - name: Drop the push entitlement
        run: |
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" || true
          done

      - name: Tools
        run: |
          xcodebuild -version
          pod --version
          grep -h "deploymentTarget" ios/Podfile.properties.json || true

      # the job log isn't always at hand: the lines that explain a failure go
      # into the run's annotations too
      - name: Pods
        run: |
          cd ios
          set +e
          pod install 2>&1 | tee ../pods.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            grep -E "\[!\]|error|Error|requires|compatib" ../pods.log | head -15 | while read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Build
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcode.log | grep -E "error:|warning: .*deprecated" | head -40
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            grep -E "error:" xcode.log | sort -u | head -15 | while read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Pack the IPA
        id: ipa
        run: |
          name="homeorg-${GITHUB_REF_NAME//\//-}.ipa"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry "$name" Payload
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.file }}
          path: ${{ steps.ipa.outputs.file }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ipa.outputs.file }}
          prerelease: ${{ contains(github.ref_name, '-') }}
